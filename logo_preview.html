<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #f0f4f8; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .wrap { display: flex; gap: 40px; align-items: center; flex-direction: column; }
  .label { font-family: sans-serif; font-size: 13px; color: #555; text-align: center; margin-top: 8px; }
  .row { display: flex; gap: 60px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; }
  .dark { background: #1a2a5e; padding: 20px; border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="item">
      <img src="images/logo_new.svg" width="200" height="200">
      <div class="label">New Logo — Light background</div>
    </div>
    <div class="item">
      <div class="dark">
        <img src="images/logo_new.svg" width="200" height="200">
      </div>
      <div class="label">New Logo — Dark background</div>
    </div>
    <div class="item">
      <img src="images/manish_logo.jpg" width="100" height="100" style="border-radius:50%">
      <div class="label">Original Logo</div>
    </div>
  </div>
</div>
</body>
</html>
